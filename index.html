<!doctype html>

    <!-- React Refresh Preamble & Sandboxed Environment Compatibility -->
    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;
      (function() {
        const origError = console.error;
        const origWarn = console.warn;
        function isViteMessage(args) {
          if (!args || !args.length) return false;
          for (let i = 0; i < args.length; i++) {
            const a = args[i];
            if (typeof a === 'string' && (a.includes('[vite]') || a.includes('websocket') || a.includes('connecting...'))) return true;
            if (a && typeof a.message === 'string' && (a.message.includes('[vite]') || a.message.includes('websocket'))) return true;
          }
          return false;
        }
        console.error = function(...args) {
          if (isViteMessage(args)) return;
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          if (isViteMessage(args)) return;
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          if (event && (
            (typeof event.message === 'string' && event.message.includes('[vite]')) ||
            (event.error && typeof event.error.message === 'string' && event.error.message.includes('[vite]'))
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
